services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: isql_php
    restart: unless-stopped
    volumes:
      - ../:/var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=sql_uit
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - isql_network

  nginx:
    image: nginx:alpine
    container_name: isql_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ../:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - isql_network

  mysql:
    image: mysql:8.0
    container_name: isql_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: sql_uit
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - isql_mysql_data:/var/lib/mysql
    networks:
      - isql_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: isql_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - isql_redis_data:/data
    networks:
      - isql_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: isql_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - isql_network

networks:
  isql_network:
    driver: bridge

volumes:
  isql_mysql_data:
  isql_redis_data:
